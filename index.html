<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x402 Facilitator Probe — Live Status</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 80ch; margin: 2em auto; padding: 0 1em; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 1.5em; margin-bottom: 0.5em; }
  .status { padding: 1em; border-radius: 8px; margin: 1em 0; }
  .status.up { background: #d4edda; border-left: 4px solid #28a745; }
  .status.down { background: #f8d7da; border-left: 4px solid #dc3545; }
  .status.unknown { background: #fff3cd; border-left: 4px solid #ffc107; }
  code { background: #f0f0f0; padding: 0.1em 0.35em; border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; margin: 1em 0; }
  th, td { padding: 0.5em; text-align: left; border-bottom: 1px solid #ddd; }
  th { background: #f5f5f5; }
  .loading { color: #666; font-style: italic; }
  .refresh { margin-top: 2em; font-size: 0.9em; color: #666; }
</style>
</head>
<body>
<h1>🔍 x402 Facilitator Probe</h1>
<p>Real-time monitoring of <code>https://x402.org/facilitator</code> from multiple origins.</p>

<div id="status-box" class="status unknown">
  <strong>Loading...</strong>
</div>

<h2>Recent Probes</h2>
<table id="probe-table">
  <thead>
    <tr><th>Time (UTC)</th><th>Origin</th><th>HTTP Code</th><th>Latency</th></tr>
  </thead>
  <tbody id="probe-body">
    <tr><td colspan="4" class="loading">Loading data...</td></tr>
  </tbody>
</table>

<div class="refresh">
  <button onclick="loadStatus()">🔄 Refresh</button>
  <span id="last-updated"></span>
</div>

<script>
const STATUS_URL = 'status.json';
const RAW_URL = 'https://raw.githubusercontent.com/logout2login/x402-probe-workflow/master/status.json';

async function loadStatus() {
  const box = document.getElementById('status-box');
  const tbody = document.getElementById('probe-body');
  const updated = document.getElementById('last-updated');
  
  try {
    const resp = await fetch(RAW_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    
    // Update status box
    const code = data.current_code;
    box.className = 'status ' + (code === 200 ? 'up' : code === 404 ? 'down' : 'unknown');
    box.innerHTML = `
      <strong>${code === 200 ? '✅ UP' : code === 404 ? '❌ 404 Not Found' : '⚠️ Unknown'}</strong><br>
      Target: <code>${data.target}</code><br>
      Last check: ${data.last_check || 'N/A'}<br>
      Origin: ${data.origin || 'N/A'}
    `;
    
    // Update table
    if (data.points && data.points.length > 0) {
      const recent = data.points.slice(-20).reverse();
      tbody.innerHTML = recent.map(p => `
        <tr>
          <td>${new Date(p.t).toISOString()}</td>
          <td>${p.origin || 'gha'}</td>
          <td><code>${p.code}</code></td>
          <td>${p.ms}ms</td>
        </tr>
      `).join('');
    }
    
    updated.textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    box.className = 'status unknown';
    box.innerHTML = `<strong>❌ Error loading status</strong><br>${e.message}`;
    tbody.innerHTML = '<tr><td colspan="4" class="loading">Failed to load probe data</td></tr>';
  }
}

// Auto-refresh every 60 seconds
loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
