name: x402 Facilitator Probe & Scan

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run probe
        run: |
          mkdir -p logs
          node scripts/probe.mjs
          node scripts/scribe.mjs >> logs/probe.log 2>&1 || true
      - name: Push probe data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run incremental scan (multi-endpoint failover)
        run: |
          mkdir -p logs
          node scripts/incremental_scan_v2.mjs logs
          echo "Scan complete - see logs/scan_*.log for details"
      - name: Upload scan logs
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs
          path: logs/scan_*.log
      - name: Push scan data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [probe, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate status page
        run: |
          mkdir -p pages
          python3 scripts/make_index.py > pages/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: true
