name: x402 Probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: |
          TARGET="https://x402.org/facilitator"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CODE=$(curl -o /dev/null -s --max-time 12 -w "%{http_code}" "$TARGET" 2>/dev/null || echo 000)
          LAT=$(curl -o /dev/null -s --max-time 12 -w "%{time_total}" "$TARGET" 2>/dev/null || echo 0)
          HEAD_CODE=$(curl -o /dev/null -s -I --max-time 12 -w "%{http_code}" "$TARGET" 2>/dev/null || echo 000)
          echo "$NOW origin=gha code=$CODE lat=${LAT}s head=$HEAD_CODE" >> probe.log
          node -e "
            const fs=require('fs');
            let s; try{s=JSON.parse(fs.readFileSync('status.json','utf8'))}catch(e){s={target:'https://x402.org/facilitator',points:[]};}
            s.last_check='$NOW'; s.current_code='${CODE}'; s.origin='gha';
            s.points.push({t:'$NOW',code:$CODE,ms:Math.round(${LAT}*1000)});
            if(s.points.length>500) s.points=s.points.slice(-500);
            fs.writeFileSync('status.json',JSON.stringify(s,null,2));
          "
      - name: Commit & push
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@x402.org"
          git add probe.log status.json
          git commit -m "probe ${{ github.run_number }}" || echo "no change"
          git push
